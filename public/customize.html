<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PHCM POS | Customize</title>

  <link rel="stylesheet" href="styles.css" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
</head>
<body>

<header class="header">
  <div class="header-brand">
    <img src="/photos/phcm-logo.png" class="header-logo" alt="PHCM Logo" />
    PHCM CAFETERIA
  </div>
  <nav class="header-nav">
    <a href="dashboard.html">Dashboard</a>
    <a href="#" id="logoutBtn">Logout</a>
  </nav>
</header>

<main class="customize-container">
  <div class="customize-topbar">
    <h1 class="customize-title">
      <i class="fas fa-utensils"></i> Menu Customization
    </h1>

    <div class="customize-toolbar">
      <div class="customize-tabs" role="tablist" aria-label="Product Filter Tabs">
        <button type="button" class="active" data-tab="all">All</button>
        <button type="button" data-tab="menu">Menu</button>
        <button type="button" data-tab="addons">Add-ons</button>
      </div>

      <div class="customize-search">
        <i class="fas fa-search" style="color:#64748b;"></i>
        <input id="searchInput" type="text" placeholder="Search products..." />
      </div>

      <button id="openAddBtn" class="customize-addbtn" type="button">
        <i class="fas fa-plus-circle"></i> Add New Product
      </button>
    </div>
  </div>

  <section>
    <div id="productsGrid" class="customize-grid"></div>
  </section>
</main>

<!-- MODAL -->
<div id="modalBackdrop" class="customize-backdrop" aria-hidden="true">
  <div class="customize-modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="customize-modalhead">
      <h3 id="modalTitle">Add New Product</h3>
      <button class="customize-close" id="modalCloseBtn" type="button" aria-label="Close">
        <i class="fas fa-times"></i>
      </button>
    </div>

    <div class="customize-modalbody">
      <div class="customize-formgrid">
        <div>
          <label class="small">Product Name</label>
          <input id="nameInput" class="input" type="text" placeholder="e.g. Porkchop" />
        </div>

        <!-- ✅ NEW: Upload image -->
        <div>
          <label class="small">Upload Image</label>
          <input id="photoFile" class="input" type="file" accept="image/*" />
          <small class="small" style="color:#64748b;">
            JPG/PNG/WebP only. Max 5MB.
          </small>
        </div>

        <div>
          <label class="small">Selling Price (₱)</label>
          <input id="priceInput" class="input" type="number" placeholder="0.00" step="0.01" />
        </div>

        <div>
          <label class="small">Cost Price (₱)</label>
          <input id="costPriceInput" class="input" type="number" placeholder="0.00" step="0.01" />
        </div>

        <div class="full">
          <label class="small">Stock Quantity</label>
          <input id="stockInput" class="input" type="number" placeholder="0" />
        </div>

        <!-- ✅ shows current saved photo_path when editing -->
        <div class="full">
          <small class="small" id="currentPhotoLabel" style="color:#64748b; display:none;"></small>
        </div>
      </div>

      <div class="customize-hint">
        <strong>Tip:</strong> To create an add-on, name it like <code>[A/O] Extra Rice</code>.
        <br/>
        If you upload a photo here, it will automatically save to the server.
      </div>

      <p id="formError" class="small" style="color:#e53e3e; margin-top:10px;"></p>

      <input type="hidden" id="productId" />
      <input type="hidden" id="photoPath" /> <!-- ✅ server photo path stored here -->
    </div>

    <div class="customize-modalactions">
      <button class="customize-cancel" id="cancelBtn" type="button">Cancel</button>
      <button class="customize-save" id="saveBtn" type="button">
        <i class="fas fa-save"></i> Save
      </button>
    </div>
  </div>
</div>

<script>
  const token = localStorage.getItem("pos_token");

  // UI state
  let allProducts = [];
  let currentTab = "all"; // all | menu | addons
  let currentSearch = "";

  // Elements
  const gridEl = document.getElementById("productsGrid");
  const searchEl = document.getElementById("searchInput");

  const modalBackdrop = document.getElementById("modalBackdrop");
  const modalTitle = document.getElementById("modalTitle");
  const modalCloseBtn = document.getElementById("modalCloseBtn");
  const cancelBtn = document.getElementById("cancelBtn");

  const openAddBtn = document.getElementById("openAddBtn");
  const saveBtn = document.getElementById("saveBtn");

  const productIdEl = document.getElementById("productId");
  const nameEl = document.getElementById("nameInput");
  const priceEl = document.getElementById("priceInput");
  const costEl = document.getElementById("costPriceInput");
  const stockEl = document.getElementById("stockInput");
  const formErrorEl = document.getElementById("formError");

  // ✅ new upload fields
  const photoFileEl = document.getElementById("photoFile");
  const photoPathEl = document.getElementById("photoPath");
  const currentPhotoLabelEl = document.getElementById("currentPhotoLabel");

  // Auth guard
  document.addEventListener("DOMContentLoaded", () => {
    if (!token) {
      location.href = "login.html";
      return;
    }

    document.getElementById("logoutBtn").addEventListener("click", (e) => {
      e.preventDefault();
      localStorage.removeItem("pos_token");
      location.href = "login.html";
    });

    // Tabs
    document.querySelectorAll(".customize-tabs button").forEach(btn => {
      btn.addEventListener("click", () => {
        document.querySelectorAll(".customize-tabs button").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        currentTab = btn.dataset.tab;
        renderGrid();
      });
    });

    // Search
    searchEl.addEventListener("input", () => {
      currentSearch = (searchEl.value || "").trim().toLowerCase();
      renderGrid();
    });

    // Modal open add
    openAddBtn.addEventListener("click", () => {
      openModalForAdd();
    });

    // Modal close
    modalCloseBtn.addEventListener("click", closeModal);
    cancelBtn.addEventListener("click", closeModal);
    modalBackdrop.addEventListener("click", (e) => {
      if (e.target === modalBackdrop) closeModal();
    });
    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape") closeModal();
    });

    // Save
    saveBtn.addEventListener("click", saveProduct);

    fetchProducts();
  });

  function peso(n) {
    return "₱" + Number(n || 0).toFixed(2);
  }

  function isAddon(p) {
    return (p.name || "").toUpperCase().startsWith("[A/O]");
  }

  function stockBadgeClass(stock) {
    if (stock === 0) return "out";
    if (stock <= 5) return "low";
    return "ok";
  }

  function openModal() {
    modalBackdrop.style.display = "flex";
    modalBackdrop.setAttribute("aria-hidden", "false");
  }

  function closeModal() {
    modalBackdrop.style.display = "none";
    modalBackdrop.setAttribute("aria-hidden", "true");
    clearForm();
  }

  function clearForm() {
    productIdEl.value = "";
    nameEl.value = "";
    priceEl.value = "";
    costEl.value = "";
    stockEl.value = "";
    formErrorEl.textContent = "";
    photoFileEl.value = "";
    photoPathEl.value = "";
    currentPhotoLabelEl.style.display = "none";
    currentPhotoLabelEl.textContent = "";
  }

  function openModalForAdd() {
    clearForm();
    modalTitle.textContent = "Add New Product";
    openModal();
    setTimeout(() => nameEl.focus(), 0);
  }

  function openModalForEdit(p) {
    clearForm();
    modalTitle.textContent = "Edit Product";
    productIdEl.value = p.id;

    nameEl.value = p.name || "";
    priceEl.value = Number(p.price || 0);
    costEl.value = Number(p.cost_price || 0);
    stockEl.value = Number(p.stock || 0);
    const existing = p.photo_path || "";
    photoPathEl.value = existing;

    if (existing) {
      currentPhotoLabelEl.style.display = "block";
      currentPhotoLabelEl.textContent = `Current Photo: ${existing}`;
    }

    openModal();
    setTimeout(() => nameEl.focus(), 0);
  }

  async function fetchProducts() {
    try {
      const res = await fetch("/api/products", {
        headers: { Authorization: `Bearer ${token}` }
      });
      allProducts = await res.json();
      renderGrid();
    } catch (err) {
      console.error("Fetch products error:", err);
      gridEl.innerHTML = `
        <div class="customize-empty">
          <h3>Couldn’t load products</h3>
          <p>Check the server and refresh.</p>
        </div>
      `;
    }
  }

  function filteredProducts() {
    let items = [...allProducts];

    if (currentTab === "menu") {
      items = items.filter(p => !isAddon(p));
    } else if (currentTab === "addons") {
      items = items.filter(p => isAddon(p));
    }

    if (currentSearch) {
      items = items.filter(p => (p.name || "").toLowerCase().includes(currentSearch));
    }

    items.sort((a, b) => {
      const aa = isAddon(a) ? 1 : 0;
      const bb = isAddon(b) ? 1 : 0;
      if (aa !== bb) return aa - bb;
      return (a.name || "").localeCompare((b.name || ""));
    });

    return items;
  }

  function renderGrid() {
    const items = filteredProducts();

    if (!items.length) {
      gridEl.innerHTML = `
        <div class="customize-empty">
          <h3>No products found</h3>
          <p>Try changing the tab or search keyword.</p>
        </div>
      `;
      return;
    }

    gridEl.innerHTML = items.map(p => {
      const img = p.photo_path || "/photos/default.png";
      const badge = stockBadgeClass(Number(p.stock || 0));

      return `
        <article class="customize-card">
          <div class="customize-img">
            <img src="${img}" onerror="this.src='/photos/default.png'" alt="${escapeHTML(p.name || "Product")}" />
          </div>

          <div class="customize-body">
            <div class="customize-name">${escapeHTML(p.name || "")}</div>

            <div class="customize-row">
              <div class="customize-price">${peso(p.price)}</div>
              <span class="customize-stock ${badge}">
                ${Number(p.stock || 0)} stock
              </span>
            </div>

            <div class="customize-meta">
              <span>Cost: ${peso(p.cost_price || 0)}</span>
              <span>#${p.id}</span>
            </div>
          </div>

          <div class="customize-actions">
            <button class="customize-btn edit" type="button" data-action="edit" data-id="${p.id}">
              <i class="fas fa-edit"></i> Edit
            </button>
            <button class="customize-btn del" type="button" data-action="delete" data-id="${p.id}">
              <i class="fas fa-trash"></i> Delete
            </button>
          </div>
        </article>
      `;
    }).join("");

    gridEl.querySelectorAll("button[data-action]").forEach(btn => {
      btn.addEventListener("click", () => {
        const id = Number(btn.dataset.id);
        const action = btn.dataset.action;
        const p = allProducts.find(x => Number(x.id) === id);
        if (!p) return;

        if (action === "edit") openModalForEdit(p);
        if (action === "delete") deleteProduct(p);
      });
    });
  }

  function escapeHTML(str) {
    return String(str)
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#039;");
  }

  // FILE UPLOAD SELECTED
  async function uploadPhotoIfNeeded() {
    const file = photoFileEl?.files?.[0];
    if (!file) return photoPathEl.value || "";

    const fd = new FormData();
    fd.append("photo", file);

    const res = await fetch("/api/upload", {
      method: "POST",
      headers: { Authorization: `Bearer ${token}` },
      body: fd
    });

    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.error || "Upload failed.");

    photoPathEl.value = data.photo_path || "";
    return photoPathEl.value;
  }

  async function saveProduct() {
    const id = (productIdEl.value || "").trim();
    const name = (nameEl.value || "").trim();
    const price = parseFloat(priceEl.value);
    const cost_price = parseFloat(costEl.value) || 0;
    const stock = parseInt(stockEl.value, 10);

    formErrorEl.textContent = "";

    if (!name) {
      formErrorEl.textContent = "Product name is required.";
      return;
    }
    if (Number.isNaN(price)) {
      formErrorEl.textContent = "Selling price is required.";
      return;
    }
    if (Number.isNaN(stock)) {
      formErrorEl.textContent = "Stock quantity is required.";
      return;
    }

    const method = id ? "PUT" : "POST";
    const url = id ? `/api/products/${id}` : "/api/products";

    try {
      // ✅ upload first (if user chose a file)
      const photo_path = await uploadPhotoIfNeeded();

      const res = await fetch(url, {
        method,
        headers: {
          "Content-Type": "application/json",
          Authorization: `Bearer ${token}`
        },
        body: JSON.stringify({ name, price, cost_price, stock, photo_path })
      });

      const data = await res.json().catch(() => ({}));

      if (!res.ok) {
        formErrorEl.textContent = data.error || "Failed to save product.";
        return;
      }

      closeModal();
      await fetchProducts();
    } catch (err) {
      console.error("Save error:", err);
      formErrorEl.textContent = err.message || "Server error. Please try again.";
    }
  }

  async function deleteProduct(p) {
    if (!confirm(`Delete "${p.name}"?`)) return;

    try {
      const res = await fetch(`/api/products/${p.id}`, {
        method: "DELETE",
        headers: { Authorization: `Bearer ${token}` }
      });

      const data = await res.json().catch(() => ({}));
      if (!res.ok) {
        alert(data.error || "Failed to delete product.");
        return;
      }

      await fetchProducts();
    } catch (err) {
      console.error("Delete error:", err);
      alert("Server error. Please try again.");
    }
  }
</script>

</body>
</html>

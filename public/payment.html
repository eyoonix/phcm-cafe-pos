<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>PHCM POS | Cart</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
</head>
<body>

<header class="header">
  <div class="header-brand">
    <img src="/photos/phcm-logo.png" class="header-logo" alt="Logo" />
    PHCM CAFETERIA
  </div>
  <a href="dashboard.html" class="btn-primary" style="text-decoration:none;">Dashboard</a>
</header>

<div class="payment-layout">
  <div class="card" style="flex:2; overflow-y:auto;">
    <h3><i class="fas fa-utensils"></i> Menu Items</h3>
    <div id="productGrid"></div>
  </div>

  <div class="card cart-panel">
    <h3><i class="fa fa-shopping-cart"></i> Cart</h3>

    <div class="cart-list" id="cartList"></div>

    <!-- ✅ ADD-ONS SECTION -->
    <div class="addons-panel">
      <div class="addons-title">
        <i class="fas fa-plus-circle"></i> Add-ons
      </div>
      <div id="addonGrid" class="addon-grid"></div>
    </div>
    <!-- ✅ END ADD-ONS SECTION -->

    <div class="cart-total">Total: <span id="totalAmount">₱0.00</span></div>

    <div style="margin-top:15px;">
      <label>Cash Received</label>
      <input type="number" id="paymentInput" class="input" placeholder="₱0.00">
    </div>

    <div class="quick-cash-grid" style="display:grid; grid-template-columns:repeat(3, 1fr); gap:5px; margin-top:10px;">
      <button class="btn-secondary" onclick="setCash(20)">₱20.00</button>
      <button class="btn-secondary" onclick="setCash(50)">₱50.00</button>
      <button class="btn-secondary" onclick="setCash(100)">₱100.00</button>
      <button class="btn-secondary" onclick="setCash(200)">₱200.00</button>
      <button class="btn-secondary" onclick="setCash(500)">₱500.00</button>
      <button class="btn-secondary" onclick="setCash(1000)">₱1,000.00</button>
      <button class="btn-secondary" style="grid-column: span 3; background-color:#38a169; color:white;" onclick="setExact()">
        EXACT AMOUNT
      </button>
    </div>

    <div style="margin:10px 0;">Change: <span id="changeDue">₱0.00</span></div>

    <button id="processBtn" class="btn-primary" style="width:100%" disabled>Complete Sale</button>
  </div>
</div>

<!-- ✅ RECEIPT PREVIEW (WITH LOGO + TABLE) -->
<div id="receiptArea" class="receipt-window receipt-preview" style="display:none; margin: 25px;">
  <div class="receipt-header" style="text-align:center;">
    <img src="/photos/phcm-logo.png" alt="Logo" class="receipt-logo" style="width:70px;height:auto;margin-bottom:6px;" />
    <h3 style="margin:0;">UPHS - Manila</h3>
    <div style="font-size:12px; margin-top:6px;">
      <div id="receiptTxn">Transaction #0000</div>
      <div id="receiptMeta"></div>
    </div>
  </div>

  <div class="receipt-divider"></div>

  <table class="receipt-table" style="width:100%; font-size:12px; border-collapse:collapse;">
    <thead>
      <tr>
        <th style="text-align:left; border-bottom:1px dashed #000; padding-bottom:6px;">Qty</th>
        <th style="text-align:left; border-bottom:1px dashed #000; padding-bottom:6px;">Item</th>
        <th style="text-align:right; border-bottom:1px dashed #000; padding-bottom:6px;">Amount</th>
      </tr>
    </thead>
    <tbody id="receiptItemsTable"></tbody>
  </table>

  <div class="receipt-divider"></div>

  <div class="receipt-line bold">
    <span>Total</span>
    <span id="receiptTotal">₱0.00</span>
  </div>
  <div class="receipt-line">
    <span>Cash</span>
    <span id="receiptCash">₱0.00</span>
  </div>
  <div class="receipt-line">
    <span>Change</span>
    <span id="receiptChange">₱0.00</span>
  </div>

  <div class="receipt-divider"></div>
  <div class="receipt-footer" style="text-align:center;">Thank you! ❤️</div>
</div>

<button id="printBtn" class="btn-primary" style="display:none; margin: 0 25px 25px;">
  <i class="fas fa-print"></i> Print Receipt
</button>

<!-- ALERT MODAL-->
<div id="posModalBackdrop" class="pos-modal-backdrop" aria-hidden="true">
  <div class="pos-modal" role="dialog" aria-modal="true" aria-labelledby="posModalTitle">
    <div class="pos-modal-head">
      <h3 id="posModalTitle">Notice</h3>
      <button type="button" class="pos-modal-close" id="posModalCloseBtn" aria-label="Close">✕</button>
    </div>

    <div class="pos-modal-body">
      <p id="posModalMsg" style="margin:0;"></p>
    </div>

    <div class="pos-modal-actions">
      <button type="button" class="pos-modal-ok" id="posModalOkBtn">OK</button>
    </div>
  </div>
</div>

<script>
  let cart = [];
  let products = [];
  let menuProducts = [];
  let addonProducts = [];

  const token = localStorage.getItem('pos_token');
  if (!token) window.location.href = 'login.html';  let lastReceiptData = null;

  function peso(n) { return "₱" + Number(n).toFixed(2); }

  function isAddonProduct(p) {
    return String(p.name || "").startsWith("[A/O]");
  }

  // CENTER MODAL
  function showCenterModal(message, title = "Notice") {
    const backdrop = document.getElementById("posModalBackdrop");
    const titleEl = document.getElementById("posModalTitle");
    const msgEl = document.getElementById("posModalMsg");
    const okBtn = document.getElementById("posModalOkBtn");
    const closeBtn = document.getElementById("posModalCloseBtn");

    titleEl.textContent = title;
    msgEl.textContent = message;

    backdrop.classList.add("show");
    backdrop.setAttribute("aria-hidden", "false");

    return new Promise((resolve) => {
      const cleanup = () => {
        backdrop.classList.remove("show");
        backdrop.setAttribute("aria-hidden", "true");
        okBtn.removeEventListener("click", onOk);
        closeBtn.removeEventListener("click", onOk);
        backdrop.removeEventListener("click", onBackdrop);
        document.removeEventListener("keydown", onEsc);
        resolve();
      };

      const onOk = () => cleanup();
      const onBackdrop = (e) => { if (e.target === backdrop) cleanup(); };
      const onEsc = (e) => { if (e.key === "Escape") cleanup(); };

      okBtn.addEventListener("click", onOk);
      closeBtn.addEventListener("click", onOk);
      backdrop.addEventListener("click", onBackdrop);
      document.addEventListener("keydown", onEsc);
    });
  }

  function formatPH12(created_at) {
    const d = new Date(created_at.replace(" ", "T"));
    return d.toLocaleString("en-PH", {
      timeZone: "Asia/Manila",
      year: "numeric",
      month: "2-digit",
      day: "2-digit",
      hour: "2-digit",
      minute: "2-digit",
      second: "2-digit",
      hour12: true
    });
  }

  function buildReceiptHTML(data) {
    return `
      <div class="receipt-window">
        <div class="receipt-header" style="text-align:center;">
          <img src="/photos/phcm-logo.png" class="receipt-logo" style="width:70px;height:auto;margin-bottom:6px;" />
          <h3 style="margin:0;">UPHS - Manila</h3>
          <div style="font-size:12px;margin-top:6px;">
            Transaction #${String(data.transaction_id).padStart(4, "0")}<br/>
            ${formatPH12(data.created_at)}
          </div>
        </div>

        <div class="receipt-divider"></div>

        ${data.items.map(it => `
          <div class="receipt-line">
            <span>${it.name} x${it.qty}</span>
            <span>${peso(it.line_total)}</span>
          </div>
          <div class="receipt-line" style="font-size:11px;">
            <span>@ ${peso(it.unit_price)} each</span>
            <span></span>
          </div>
        `).join("")}

        <div class="receipt-divider"></div>

        <div class="receipt-line bold">
          <span>Total</span>
          <span>${peso(data.grand_total)}</span>
        </div>
        <div class="receipt-line">
          <span>Cash</span>
          <span>${peso(data.cash)}</span>
        </div>
        <div class="receipt-line">
          <span>Change</span>
          <span>${peso(data.change)}</span>
        </div>

        <div class="receipt-divider"></div>
        <div class="receipt-footer" style="text-align:center;">Thank you! ❤️</div>
      </div>
    `;
  }

  async function fetchProducts() {
    const res = await fetch("/api/products", {
      headers: { Authorization: `Bearer ${token}` }
    });

    products = await res.json();

    menuProducts = products.filter(p => !isAddonProduct(p));
    addonProducts = products.filter(p => isAddonProduct(p));

    renderMenuGrid();
    renderAddons();
  }

  function renderMenuGrid() {
    const grid = document.getElementById("productGrid");
    grid.innerHTML = "";

    menuProducts.forEach(p => {
      const isOutOfStock = p.stock <= 0;
      const div = document.createElement("div");
      div.className = `product-btn ${isOutOfStock ? "disabled-item" : ""}`;

      div.innerHTML = `
        <img src="${p.photo_path || "/photos/default.png"}"
             onerror="this.src='/photos/default.png'"
             style="${isOutOfStock ? "filter: grayscale(100%); opacity: 0.5;" : ""}">
        <div class="info">
          <strong>${p.name}</strong><br>
          <small>
            ${isOutOfStock
              ? '<span style="color:red; font-weight:bold;">OUT OF STOCK</span>'
              : `₱${p.price.toFixed(2)} | Stock: ${p.stock}`
            }
          </small>
        </div>
      `;

      div.onclick = async () => {
        if (isOutOfStock) return showCenterModal("This item is currently out of stock!", "Out of Stock");
        addToCart(p);
      };

      grid.appendChild(div);
    });
  }

  function renderAddons() {
    const addonGrid = document.getElementById("addonGrid");
    if (!addonGrid) return;

    if (addonProducts.length === 0) {
      addonGrid.innerHTML = `<div class="addon-empty">No add-ons yet</div>`;
      return;
    }

    addonGrid.innerHTML = addonProducts.map(p => `
      <button class="addon-btn" onclick="addToCartById(${p.id})">
        <span>${String(p.name).replace("[A/O] ", "")}</span>
        <strong>${peso(p.price)}</strong>
      </button>
    `).join("");
  }

  function addToCartById(id) {
    const p = products.find(x => x.id === id);
    if (!p) return;
    addToCart(p);
  }

  async function addToCart(p) {
    const itemInCart = cart.find(i => i.product_id === p.id);

    if (itemInCart) {
      if (itemInCart.qty >= p.stock) {
        await showCenterModal(`Sorry, only ${p.stock} units of ${p.name} are available.`, "Stock Limit");
        return;
      }
      itemInCart.qty++;
    } else {
      cart.push({ product_id: p.id, qty: 1 });
    }
    renderCart();
  }

  function removeItem(id) {
    cart = cart.filter(i => i.product_id !== id);
    renderCart();
  }

  function renderCart() {
    const list = document.getElementById("cartList");
    let total = 0;

    list.innerHTML = cart.map(item => {
      const p = products.find(prod => prod.id === item.product_id);
      if (!p) return "";
      const subtotal = p.price * item.qty;
      total += subtotal;

      return `
        <div class="cart-item">
          <span>${p.name} (x${item.qty})</span>
          <span>${peso(subtotal)}
            <i class="fas fa-trash" style="color:#e53e3e; cursor:pointer; margin-left:10px;" onclick="removeItem(${p.id})"></i>
          </span>
        </div>
      `;
    }).join("");

    document.getElementById("totalAmount").innerText = peso(total);
    updateChange();
  }

  function updateChange() {
    const total = parseFloat(document.getElementById("totalAmount").innerText.replace("₱","")) || 0;
    const cash = parseFloat(document.getElementById("paymentInput").value) || 0;
    const change = cash - total;

    document.getElementById("changeDue").innerText = peso(change > 0 ? change : 0);
    document.getElementById("processBtn").disabled = (total === 0 || cash < total);
  }

  function setCash(amount) {
    document.getElementById("paymentInput").value = amount;
    updateChange();
  }

  async function setExact() {
    const total = parseFloat(document.getElementById("totalAmount").innerText.replace("₱","")) || 0;
    if (total <= 0) return showCenterModal("Cart is empty!", "Empty Cart");
    document.getElementById("paymentInput").value = total.toFixed(2);
    updateChange();
  }

  // RECEIPT PREVIEW
  function showReceipt(items, total, cash, transactionId, createdAt) {
    const change = cash - total;

    document.getElementById("receiptTxn").innerText =
      `Transaction #${String(transactionId).padStart(4, "0")}`;

    document.getElementById("receiptMeta").innerText =
      new Date(createdAt.replace(" ", "T")).toLocaleString("en-PH", { timeZone: "Asia/Manila" });

    const tbody = document.getElementById("receiptItemsTable");
    tbody.innerHTML = "";

    items.forEach(it => {
      const p = products.find(prod => prod.id === it.product_id);
      if (!p) return;

      const lineTotal = p.price * it.qty;

      const tr = document.createElement("tr");
      tr.innerHTML = `
        <td style="padding:4px 0;">${it.qty}</td>
        <td style="padding:4px 0;">${p.name}</td>
        <td style="padding:4px 0; text-align:right;">${peso(lineTotal)}</td>
      `;
      tbody.appendChild(tr);
    });

    document.getElementById("receiptTotal").innerText = peso(total);
    document.getElementById("receiptCash").innerText = peso(cash);
    document.getElementById("receiptChange").innerText = peso(change);

    document.getElementById("receiptArea").style.display = "block";
    document.getElementById("printBtn").style.display = "inline-flex";
  }

  async function thermalPrintReceipt() {
    if (!lastReceiptData) {
      await showCenterModal("No receipt data to print yet. Complete a sale first.", "No Receipt");
      return;
    }

    const receiptHTML = buildReceiptHTML(lastReceiptData);

    const printCSS = `
      @page { size: 58mm auto; margin: 0; }

      html, body {
        margin: 0;
        padding: 0;
        width: 58mm;
        background: #fff;
      }

      body { display: block; }

      .receipt-window {
        width: 58mm;
        padding: 8mm 6mm;
        box-sizing: border-box;
        font-family: "Courier New", monospace;
        font-size: 12px;
        font-weight: 700;
        color: #000;
      }

      .receipt-header { text-align:center; }

      .receipt-logo {
        width:70px;
        height:auto;
        margin-bottom:6px;
      }

      .receipt-header h3 {
        font-size: 20px;
        font-weight: 900;
        margin: 0;
      }

      .receipt-divider { border-top: 2px dashed #000; margin: 8px 0; }
      .receipt-line { display:flex; justify-content:space-between; margin: 3px 0; }
      .receipt-line.bold { font-weight: 900; margin-top: 6px; }
      .receipt-footer { margin-top: 10px; font-size: 12px; font-weight: 900; }
    `;

    const iframe = document.createElement("iframe");
    iframe.style.position = "fixed";
    iframe.style.right = "0";
    iframe.style.bottom = "0";
    iframe.style.width = "0";
    iframe.style.height = "0";
    iframe.style.border = "0";
    document.body.appendChild(iframe);

    const doc = iframe.contentWindow.document;
    doc.open();
    doc.write(`
      <html>
        <head>
          <meta charset="utf-8" />
          <title>Receipt</title>
          <style>${printCSS}</style>
        </head>
        <body>${receiptHTML}</body>
      </html>
    `);
    doc.close();

    setTimeout(() => {
      iframe.contentWindow.focus();
      iframe.contentWindow.print();
      setTimeout(() => document.body.removeChild(iframe), 800);
    }, 300);
  }

  document.getElementById("paymentInput").addEventListener("input", updateChange);

  document.getElementById("processBtn").onclick = async () => {
    const cash = parseFloat(document.getElementById("paymentInput").value) || 0;
    const total = parseFloat(document.getElementById("totalAmount").innerText.replace("₱","")) || 0;

    const response = await fetch("/api/sales", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "Authorization": `Bearer ${token}`
      },
      body: JSON.stringify({ items: cart, payment: cash })
    });

    const result = await response.json();

    if (result.error) {
      await showCenterModal(result.error, "Error");
      return;
    }

    await showCenterModal("SUCCESSFUL!", "PAYMENT STATUS");

    const r = await fetch(`/api/sales/receipt?transaction_id=${result.transaction_id}`, {
      headers: { Authorization: `Bearer ${token}` }
    });
    const receiptData = await r.json();

    if (receiptData.error) {
      await showCenterModal("Receipt error: " + receiptData.error, "Receipt Error");
      return;
    }

    lastReceiptData = receiptData;

    showReceipt(cart, total, receiptData.cash, receiptData.transaction_id, receiptData.created_at);

    cart = [];
    document.getElementById("paymentInput").value = "";
    await fetchProducts();
    renderCart();
  };

  document.getElementById("printBtn").addEventListener("click", thermalPrintReceipt);

  fetchProducts();
</script>

</body>
</html>

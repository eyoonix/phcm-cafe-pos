<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PHCM POS | Statistics</title>

  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
</head>
<body>

<header class="header">
  <div class="header-brand">
    <img src="/photos/phcm-logo.png" class="header-logo" alt="PHCM Logo" />
    PHCM CAFETERIA
  </div>
  <nav class="header-nav">
    <a href="dashboard.html">Dashboard</a>
    <a href="#" id="logoutBtn">Logout</a>
  </nav>
</header>

<div class="dashboard-container">

  <div class="topbar" style="display:flex;justify-content:space-between;align-items:center;">
    <h1><i class="fas fa-chart-line"></i> SALES STATISTICS</h1>

    <div>
      <input type="date" id="datePicker" class="input" style="width:180px;">
    </div>
  </div>

  <!-- KPI -->
  <div class="kpi-grid">
    <div class="kpi-card">
      <h4>Total Revenue</h4>
      <div class="value revenue-value" id="revenueValue">₱0.00</div>
    </div>

    <div class="kpi-card">
      <h4>Net Profit</h4>
      <div class="value profit-value" id="profitValue">₱0.00</div>
    </div>

    <div class="kpi-card">
      <h4>Sales Count</h4>
      <div class="value" id="salesCountValue">0</div>
    </div>
  </div>

  <!-- Best Selling Products -->
  <div class="card">
    <h3><i class="fas fa-trophy"></i> BEST SELLING PRODUCTS</h3>
    <table class="data-table stats-table">
      <thead>
        <tr>
          <th>Product Name</th>
          <th>Total Sold</th>
        </tr>
      </thead>
      <tbody id="topItemsTableBody"></tbody>
    </table>
  </div>

  <!-- Top Addons -->
  <div class="card" style="margin-top:20px;">
    <h3><i class="fas fa-bowl-rice"></i> TOP SELLING ADD-ONS</h3>
    <table class="data-table stats-table">
      <thead>
        <tr>
          <th>Add-on Name</th>
          <th>Total Sold</th>
        </tr>
      </thead>
      <tbody id="topAddonsTableBody"></tbody>
    </table>
  </div>

</div>

<script>
const token = localStorage.getItem('pos_token');
if (!token) window.location.href = 'login.html';

document.getElementById('logoutBtn').addEventListener('click', (e) => {
  e.preventDefault();
  localStorage.removeItem('pos_token');
  window.location.href = 'login.html';
});

function peso(n) {
  return '₱' + Number(n || 0).toFixed(2);
}

const datePicker = document.getElementById("datePicker");

// Default = today
const today = new Date().toISOString().split("T")[0];
datePicker.value = today;

async function fetchStats(date) {
  try {
    const res = await fetch(`/api/stats?date=${date}`, {
      headers: { 'Authorization': `Bearer ${token}` }
    });

    const data = await res.json();

    document.getElementById('revenueValue').textContent = peso(data.revenue);
    document.getElementById('profitValue').textContent = peso(data.profit);
    document.getElementById('salesCountValue').textContent = data.total_sales ?? 0;

    const productsBody = document.getElementById('topItemsTableBody');
    productsBody.innerHTML = '';

    if (!data.top_items.length) {
      productsBody.innerHTML = `<tr><td colspan="2">No sales.</td></tr>`;
    } else {
      data.top_items.forEach(item => {
        const row = productsBody.insertRow();
        row.innerHTML = `
          <td><strong>${item.name}</strong></td>
          <td><span class="badge">${item.sold} sold</span></td>
        `;
      });
    }

    const addonsBody = document.getElementById('topAddonsTableBody');
    addonsBody.innerHTML = '';

    if (!data.top_addons.length) {
      addonsBody.innerHTML = `<tr><td colspan="2">No add-on sales.</td></tr>`;
    } else {
      data.top_addons.forEach(item => {
        const clean = item.name.replace('[A/O] ', '');
        const row = addonsBody.insertRow();
        row.innerHTML = `
          <td><strong>${clean}</strong></td>
          <td><span class="badge">${item.sold} sold</span></td>
        `;
      });
    }

  } catch (err) {
    console.error(err);
  }
}

datePicker.addEventListener("change", () => {
  fetchStats(datePicker.value);
});

document.addEventListener("DOMContentLoaded", () => {
  fetchStats(today);
});
</script>

</body>
</html>

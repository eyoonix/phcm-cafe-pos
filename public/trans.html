<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>PHCM POS | Transactions</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
</head>
<body>

<header class="header">
  <div class="header-brand">
    <img src="/photos/phcm-logo.png" class="header-logo" alt="Logo" />
    PHCM CAFETERIA
  </div>
  <a href="dashboard.html" class="btn-primary" style="text-decoration:none;">Dashboard</a>
</header>

<div class="container">
  <div style="display:flex;justify-content:space-between;align-items:center;">
    <h1><i class="fas fa-history"></i> Transaction History</h1>
    <input type="date" id="datePicker" class="input" style="width:180px;">
  </div>

  <div id="historyContainer" class="history-list"></div>
</div>

<script>
const token = localStorage.getItem("pos_token");
if (!token) window.location.href = "login.html";

function peso(n) { return "₱" + Number(n).toFixed(2); }

const datePicker = document.getElementById("datePicker");
const today = new Date().toISOString().split("T")[0];
datePicker.value = today;

async function loadHistory(date) {
  const res = await fetch(`/api/sales/transactions?date=${date}`, {
    headers: { Authorization: `Bearer ${token}` }
  });

  const history = await res.json();
  const container = document.getElementById("historyContainer");
  container.innerHTML = "";

  if (!history.length) {
    container.innerHTML = "<p>No transactions for this date.</p>";
    return;
  }

  history.forEach((tx) => {
    const dateStr = new Date(tx.created_at.replace(" ", "T"))
      .toLocaleString("en-PH", {
        month: "short",
        day: "numeric",
        hour: "2-digit",
        minute: "2-digit"
      });

    const card = document.createElement("div");
    card.className = "order-card";

    card.innerHTML = `
      <details>
        <summary>
          <div class="summary-content">
            <span class="order-id">Order #${String(tx.transaction_id).padStart(3,"0")}</span>
            <span class="order-date">${dateStr}</span>
            <span class="badge">${tx.item_count} Items</span>
            <span class="order-total">${peso(tx.grand_total)}</span>
            <i class="fas fa-chevron-down toggle-icon"></i>
          </div>
        </summary>

        <div class="order-details">
          <div class="breakdown-grid">
            ${(tx.items_summary || "").split(",").filter(Boolean).map(item => `
              <div class="breakdown-item">${item}</div>
            `).join("")}
          </div>
        </div>
      </details>
    `;

    container.appendChild(card);
  });
}

datePicker.addEventListener("change", () => {
  loadHistory(datePicker.value);
});

document.addEventListener("DOMContentLoaded", () => {
  loadHistory(today);
});
</script>

</body>
</html>
